[project]
name = "board-qa-prep"
version = "0.3.3"
description = "A Claude skill that drafts the questions a board will likely ask about a bet, answered from the Landing Loop record or open with an owner."
requires-python = ">=3.11"
# Standard library only, on purpose: the scripts run inside sandboxes that cannot install packages.
dependencies = []

[tool.ruff]
line-length = 180
target-version = "py311"
# svgkit is copied unchanged from landing-loop at a pinned commit (VENDORED.json); linted there, never edited here.
extend-exclude = ["skills/board-qa-prep/scripts/vendor"]

[tool.ruff.lint]
# E, F: errors and unused names. I: import order. B: likely bugs. UP: old syntax.
# SIM: needless complexity. S: security (bandit).
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests run the CLI on fixed arguments.
"evals/**" = ["S603", "S101"]
# Vendored unchanged from the landing-brief skill, which targets Python 3.9.
"skills/board-qa-prep/scripts/landing_brief.py" = ["UP", "S101"]
# The page's CSS and markup read best one rule or row per line.
"skills/board-qa-prep/scripts/render_html.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["board_qa", "check", "display", "figures", "landing_brief", "loop", "render_html", "svgkit", "test_record"]

[tool.ruff.format]
exclude = ["skills/board-qa-prep/scripts/landing_brief.py"]
